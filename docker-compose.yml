name: dura-vault
services:
  db:
    image: postgres:15-alpine
    container_name: dura-vault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLASSIC_PGDATABASE}
      POSTGRES_USER: ${CLASSIC_PGUSER}
      POSTGRES_PASSWORD: ${CLASSIC_PGPASSWORD}
    ports:
      - '${CLASSIC_PGPORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${CLASSIC_PGUSER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  scraper:
    build: .
    image: dura-vault-scraper
    container_name: dura-vault-scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER: classic
      CLASSIC_PGHOST: db
      CLASSIC_PGPORT: 5432
      CLASSIC_PGDATABASE: ${CLASSIC_PGDATABASE}
      CLASSIC_PGUSER: ${CLASSIC_PGUSER}
      CLASSIC_PGPASSWORD: ${CLASSIC_PGPASSWORD}
      CLASSIC_DB_SSL: ${CLASSIC_DB_SSL}
      CLASSIC_BASE_URL: ${CLASSIC_BASE_URL}
      CLASSIC_HIGHSCORES_PAGES: ${CLASSIC_HIGHSCORES_PAGES}
      CLASSIC_SERVER_TIMEZONE: ${CLASSIC_SERVER_TIMEZONE}
    command: sh -c "node dist/db/init-db.js && tail -f /dev/null"
    stdin_open: true
    tty: true
    networks:
      - network

volumes:
  db-data:
    name: dura-vault-db

networks:
  network:
    driver: bridge
