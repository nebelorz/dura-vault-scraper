name: ${COMPOSE_PROJECT_NAME:-dura-vault}

services:
  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dura-vault}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - '${HOST_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  scraper:
    build: .
    image: dura-vault-scraper
    container_name: ${COMPOSE_PROJECT_NAME:-dura-vault}-scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER: ${SERVER:-classic}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      DB_SSL: ${DB_SSL}
      BASE_URL: ${BASE_URL}
      HIGHSCORES_PAGES: ${HIGHSCORES_PAGES}
      SERVER_TIMEZONE: ${SERVER_TIMEZONE}
    command: sh -c "node dist/db/init-db.js && tail -f /dev/null"
    stdin_open: true
    tty: true
    networks:
      - network

volumes:
  db-data:
    name: ${COMPOSE_PROJECT_NAME:-dura-vault}-db

networks:
  network:
    driver: bridge
