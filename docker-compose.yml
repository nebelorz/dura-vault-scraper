name: dura-vault
services:
  db:
    image: postgres:15-alpine
    container_name: dura-vault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - '${PGPORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  scraper:
    build: .
    image: dura-vault-scraper
    container_name: dura-vault-scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      DB_SSL: ${DB_SSL}
      HIGHSCORES_SCRAPER_BASE_URL: ${HIGHSCORES_SCRAPER_BASE_URL}
      HIGHSCORES_SCRAPER_PAGES_TO_SCRAP: ${HIGHSCORES_SCRAPER_PAGES_TO_SCRAP}
      ONLINE_SCRAPER_URL: ${ONLINE_SCRAPER_URL}
      DEATHS_SCRAPER_URL: ${DEATHS_SCRAPER_URL}
      DURA_SERVER_TIMEZONE: ${DURA_SERVER_TIMEZONE}
    command: sh -c "node dist/db/init-db.js && tail -f /dev/null"
    stdin_open: true
    tty: true
    networks:
      - network

volumes:
  db-data:
    name: dura-vault-db

networks:
  network:
    driver: bridge
