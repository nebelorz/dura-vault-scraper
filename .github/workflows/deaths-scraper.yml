name: Dura Vault - Deaths Scraper

on:
  workflow_dispatch:

concurrency:
  group: deaths-scraper
  cancel-in-progress: false

jobs:
  deaths-scraper:
    name: Deaths Scrape → deaths
    runs-on: ubuntu-latest
    environment: dura-vault-scraper
    timeout-minutes: 5

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      DB_SSL: ${{ secrets.DB_SSL }}
      DEATHS_SCRAPER_URL: ${{ vars.DEATHS_SCRAPER_URL }}
      DURA_SERVER_TIMEZONE: ${{ vars.DURA_SERVER_TIMEZONE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run deaths scraper
        run: node dist/deaths/deaths-scraper.js
