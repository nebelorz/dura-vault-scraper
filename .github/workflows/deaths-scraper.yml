name: Dura Vault - Deaths Scraper

on:
  workflow_dispatch:

concurrency:
  group: deaths-scraper
  cancel-in-progress: false

jobs:
  deaths-scraper:
    name: Deaths Scrape → deaths
    runs-on: ubuntu-latest
    environment: dura-vault-scraper
    timeout-minutes: 5

    env:
      SERVER: classic
      CLASSIC_PGHOST: ${{ secrets.PGHOST }}
      CLASSIC_PGUSER: ${{ secrets.PGUSER }}
      CLASSIC_PGPASSWORD: ${{ secrets.PGPASSWORD }}
      CLASSIC_PGDATABASE: ${{ secrets.PGDATABASE }}
      CLASSIC_PGPORT: ${{ secrets.PGPORT }}
      CLASSIC_DB_SSL: ${{ secrets.DB_SSL }}
      CLASSIC_BASE_URL: ${{ vars.BASE_URL }}
      CLASSIC_SERVER_TIMEZONE: ${{ vars.SERVER_TIMEZONE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run deaths scraper
        run: node dist/deaths/deaths-scraper.js
