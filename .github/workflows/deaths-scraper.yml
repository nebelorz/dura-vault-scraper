name: Dura Vault - Deaths Scraper
run-name: ${{ inputs.server }} - Deaths Scraper

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Server to scrape'
        type: choice
        options: [classic, seasonal]
        default: classic

concurrency:
  group: deaths-scraper-${{ inputs.server }}
  cancel-in-progress: false

jobs:
  scrape:
    if: inputs.server != 'seasonal' || vars.SEASONAL_ENABLED == 'true'
    name: Deaths Scrape → deaths
    runs-on: ubuntu-latest
    environment: ${{ inputs.server }}
    timeout-minutes: 5

    env:
      SERVER: ${{ inputs.server }}
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      DB_SSL: ${{ secrets.DB_SSL }}
      BASE_URL: ${{ vars.BASE_URL }}
      SERVER_TIMEZONE: ${{ vars.SERVER_TIMEZONE }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deaths Scrape (${{ inputs.server }})
        run: node dist/deaths/deaths-scraper.js
