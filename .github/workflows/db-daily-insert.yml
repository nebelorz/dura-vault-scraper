name: Dura Vault - Daily DB Insert

on:
  workflow_dispatch:

concurrency:
  group: db-daily-insert
  cancel-in-progress: false

jobs:
  db-daily-insert:
    name: DB Init + Highscores + Online → Production Tables
    runs-on: ubuntu-latest
    environment: dura-vault-scraper
    timeout-minutes: 15

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      DB_SSL: ${{ secrets.DB_SSL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Initialize database
        run: node dist/db/init-db.js

      - name: Run highscores daily insert
        run: node dist/highscore/highscores-daily-insert.js

      - name: Run online daily insert
        run: node dist/online/online-daily-insert.js
