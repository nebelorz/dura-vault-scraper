name: Dura Vault - Online Daily Insert (Seasonal)

on:
  workflow_dispatch:

concurrency:
  group: online-daily-insert-seasonal
  cancel-in-progress: false

jobs:
  online-daily-insert-seasonal:
    name: Online → Production Tables (Seasonal)
    runs-on: ubuntu-latest
    environment: dura-vault-scraper-seasonal
    timeout-minutes: 10

    env:
      SERVER: seasonal
      SEASONAL_PGHOST: ${{ secrets.PGHOST }}
      SEASONAL_PGUSER: ${{ secrets.PGUSER }}
      SEASONAL_PGPASSWORD: ${{ secrets.PGPASSWORD }}
      SEASONAL_PGDATABASE: ${{ secrets.PGDATABASE }}
      SEASONAL_PGPORT: ${{ secrets.PGPORT }}
      SEASONAL_DB_SSL: ${{ secrets.DB_SSL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run online daily insert
        run: node dist/online/online-daily-insert.js
