name: Dura Vault - Highscores Scraper (Seasonal)

on:
  workflow_dispatch:

concurrency:
  group: highscores-scraper-seasonal
  cancel-in-progress: false

jobs:
  highscores-scraper-seasonal:
    name: Highscores Scrape → temp_highscore_snapshots (Seasonal)
    runs-on: ubuntu-latest
    environment: dura-vault-scraper-seasonal
    timeout-minutes: 10

    env:
      SERVER: seasonal
      SEASONAL_PGHOST: ${{ secrets.PGHOST }}
      SEASONAL_PGUSER: ${{ secrets.PGUSER }}
      SEASONAL_PGPASSWORD: ${{ secrets.PGPASSWORD }}
      SEASONAL_PGDATABASE: ${{ secrets.PGDATABASE }}
      SEASONAL_PGPORT: ${{ secrets.PGPORT }}
      SEASONAL_DB_SSL: ${{ secrets.DB_SSL }}
      SEASONAL_BASE_URL: ${{ vars.BASE_URL }}
      SEASONAL_HIGHSCORES_PAGES: ${{ vars.HIGHSCORES_PAGES }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run highscores scraper
        run: node dist/highscore/highscores-scraper.js
