name: Dura Vault - Daily

on:
  workflow_dispatch:

jobs:
  daily:
    name: DB init + Highscores + Online DB inserts
    runs-on: ubuntu-latest
    environment: dura-vault-scraper

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      DB_SSL: ${{ secrets.DB_SSL }}
      HIGHSCORES_SCRAPER_BASE_URL: ${{ vars.HIGHSCORES_SCRAPER_BASE_URL }}
      HIGHSCORES_SCRAPER_PAGES_TO_SCRAP: ${{ vars.HIGHSCORES_SCRAPER_PAGES_TO_SCRAP }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build TS project
        run: npm run build

      - name: Execute database initialization
        run: node dist/db/init-db.js

      - name: Execute Highscores Scraper + DB inserts
        run: node dist/highscore/main.js

      - name: Execute Online DB inserts
        run: node dist/online/online-data-insert.js
