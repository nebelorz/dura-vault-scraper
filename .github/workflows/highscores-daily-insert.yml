name: Dura Vault - Highscores Daily Insert

on:
  workflow_dispatch:

concurrency:
  group: highscores-daily-insert
  cancel-in-progress: false

jobs:
  highscores-daily-insert:
    name: Highscores → Production Tables
    runs-on: ubuntu-latest
    environment: dura-vault-scraper
    timeout-minutes: 10

    env:
      SERVER: classic
      CLASSIC_PGHOST: ${{ secrets.PGHOST }}
      CLASSIC_PGUSER: ${{ secrets.PGUSER }}
      CLASSIC_PGPASSWORD: ${{ secrets.PGPASSWORD }}
      CLASSIC_PGDATABASE: ${{ secrets.PGDATABASE }}
      CLASSIC_PGPORT: ${{ secrets.PGPORT }}
      CLASSIC_DB_SSL: ${{ secrets.DB_SSL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run highscores daily insert
        run: node dist/highscore/highscores-daily-insert.js
