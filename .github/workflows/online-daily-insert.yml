name: Dura Vault - Online Daily Insert

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Server to process'
        type: choice
        options: [classic, seasonal]
        default: classic

concurrency:
  group: online-daily-insert-${{ inputs.server }}
  cancel-in-progress: false

jobs:
  daily-insert:
    if: inputs.server != 'seasonal' || vars.SEASONAL_ENABLED == 'true'
    name: Online → Production Tables
    runs-on: ubuntu-latest
    environment: ${{ inputs.server }}
    timeout-minutes: 10

    env:
      SERVER: ${{ inputs.server }}
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      DB_SSL: ${{ secrets.DB_SSL }}
      BASE_URL: ${{ vars.BASE_URL }}
      SERVER_TIMEZONE: ${{ vars.SERVER_TIMEZONE }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node dist/online/online-daily-insert.js
