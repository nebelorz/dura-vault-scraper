name: Dura Vault - Highscores Scraper

on:
  workflow_dispatch:

concurrency:
  group: highscores-scraper
  cancel-in-progress: false

jobs:
  highscores-scraper:
    name: Highscores Scrape → temp_highscore_snapshots
    runs-on: ubuntu-latest
    environment: dura-vault-scraper
    timeout-minutes: 10

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      DB_SSL: ${{ secrets.DB_SSL }}
      HIGHSCORES_SCRAPER_BASE_URL: ${{ vars.HIGHSCORES_SCRAPER_BASE_URL }}
      HIGHSCORES_SCRAPER_PAGES_TO_SCRAP: ${{ vars.HIGHSCORES_SCRAPER_PAGES_TO_SCRAP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run highscores scraper
        run: node dist/highscore/highscores-scraper.js
