name: Dura Vault Highscores Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '5 15 * * *'

jobs:
  scrape-and-store:
    name: Scrape highscores and store in database
    runs-on: ubuntu-latest
    environment: dura-vault-scrapper

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: ${{ secrets.PGPORT }}
      SCRAPER_BASE_URL: ${{ secrets.SCRAPER_BASE_URL }}
      SCRAPER_PAGES_TO_SCRAP: ${{ secrets.SCRAPER_PAGES_TO_SCRAP }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build TS project
        run: npm run build

      - name: Execute database initialization
        run: node dist/db/init-db.js
        env:
          NODE_ENV: production

      - name: Execute scraper
        run: node dist/main.js
        env:
          NODE_ENV: production
